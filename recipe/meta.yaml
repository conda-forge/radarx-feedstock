{% set name = "radarx" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ef89d4a61f76ea518d2fefedc403da1abc0bee597b2a3005400525e21954fcfa

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - pybind11 >=2.12                        # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools >=64
    - setuptools-scm >=8
    - wheel
    - pybind11 >=2.12
  run:
    - python
    - packaging
    - boto3
    - cartopy >=0.20.0
    - cmweather
    - lat_lon_parser
    - matplotlib-base
    - netcdf4
    - numpy
    - pooch
    - pyproj
    - scipy
    - xarray >=2024.10.0
    - xmltodict
    - xradar >=0.11

test:
  imports:
    - radarx
    - radarx.io
    - radarx.vis
    - radarx.grid._cone
    - radarx.retrieve
  requires:
    - pip
  commands:
    - pip check
    - python -c "from radarx.grid import cone; assert cone.HAS_COMPILED_KERNEL"

about:
  home: https://github.com/syedhamidali/radarx
  summary: 'Xarray-based radar toolkit for radar data analysis'
  description: |
    radarx is a Python package for processing and visualizing weather radar
    data with xarray. It builds on xradar and adds quality control, polarimetric
    retrievals, rainfall and drop size products, dealiasing, multi-Doppler winds,
    tropical-cyclone and tornado tools and fast cone gridding, with compiled C++
    kernels and NumPy fallbacks.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/syedhamidali/radarx
  doc_url: https://radarx.readthedocs.io/

extra:
  recipe-maintainers:
    - syedhamidali
